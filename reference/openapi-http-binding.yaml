openapi: 3.1.0
info:
  title: ExAP HTTP Binding
  version: 0.2.0-draft
paths:
  /exap/capability:
    get:
      operationId: exapDiscover
      responses:
        '200':
          description: Capability document
          content:
            application/json:
              schema:
                $ref: '../schemas/exap-capability.schema.json'
  /exap/contracts:
    post:
      operationId: exapContractCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract]
              properties:
                contract:
                  $ref: '../schemas/exap-attention-contract.schema.json'
                validate_only:
                  type: boolean
      responses:
        '201':
          description: Contract created
          content:
            application/json:
              schema:
                type: object
                required: [contract_id, status, effective_contract]
                properties:
                  contract_id:
                    type: string
                  status:
                    type: string
                  effective_contract:
                    $ref: '../schemas/exap-attention-contract.schema.json'
  /exap/contracts/{contract_id}/wait:
    post:
      operationId: exapWait
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until, timeout]
              properties:
                until:
                  type: array
                  items:
                    type: string
                timeout:
                  type: string
                min_severity:
                  type: string
                include:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Wait result
          content:
            application/json:
              schema:
                type: object
                required: [contract_id, return_reason, status]
                properties:
                  contract_id:
                    type: string
                  return_reason:
                    type: string
                  status:
                    type: string
                  event:
                    $ref: '../schemas/exap-attention-event.schema.json'
  /exap/attention/{attention_id}/ack:
    post:
      operationId: exapAttentionAck
      parameters:
        - name: attention_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Acknowledged
